name: Film Botu Calistir
on:
  schedule:
    - cron: '0 * * * *'  # Her saat başı çalışır
  workflow_dispatch:     # Manuel tetikleme butonu ekler

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu kopyala
        uses: actions/checkout@v3

      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' # Daha kararlı ve güncel bir Python sürümü

      - name: Kütüphaneleri Yukle
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright playwright-stealth
          # Gelecekte stealth kütüphanesini kullanmak isterseniz hata vermemesi için buraya ekledik.

      - name: Playwright Chromium Kur
        run: playwright install chromium --with-deps

      - name: Botu Calistir
        run: python fulhdfilm.py

      - name: Degisiklikleri Kaydet
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # data klasörünün varlığından emin olalım ve git takibine alalım
          mkdir -p data
          git add data/
          
          # Sadece değişiklik varsa commit yap ve pushla
          if ! git diff --cached --quiet; then
            git commit -m "Film verileri güncellendi [skip ci]"
            git push
          else
            echo "Herhangi bir değişiklik tespit edilmedi, commit atlanıyor."
          fi
