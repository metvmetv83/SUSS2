name: Film Botu Otomasyonu

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla (Checkout)
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4 playwright-stealth

      - name: Playwright Sistem Bağımlılıklarını ve Chromium Kur
        run: |
          playwright install-deps chromium
          playwright install chromium

      - name: Botu Çalıştır (fulhdfilm.py)
        run: |
          python fulhdfilm.py

      - name: Değişiklikleri Kaydet ve Depoya Gönder (Commit & Push)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/tum_filmler.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Güncelleme: Gerçek film linkleri veritabanına yazıldı [Gecelik Tarama]" && git push)
