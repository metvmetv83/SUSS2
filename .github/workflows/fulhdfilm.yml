name: Film Botu Otomasyonu
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          # curl_cffi: Cloudflare TLS parmak izi taklidini yapan kütüphane
          pip install curl_cffi beautifulsoup4

      - name: Botu Çalıştır
        run: python fulhdfilm.py

      - name: Değişiklikleri Kaydet ve Gönder
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/tum_filmler.json
          git diff --quiet && git diff --staged --quiet || \
            (git commit -m "🤖 Gecelik güncelleme: film linkleri tarandı" && git push)
