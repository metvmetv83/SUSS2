name: Film Botu Calistir
on:
  schedule:
    - cron: '0 * * * *'  # Her saat başı çalışır
  workflow_dispatch:     # Manuel tetikleme butonu

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu kopyala
        uses: actions/checkout@v3

      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yukle
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 playwright

      - name: Playwright Chromium Kur
        run: playwright install chromium --with-deps

      - name: Botu Calistir
        run: python fulhdfilm.py

      - name: Degisiklikleri Kaydet
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p data
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Film verileri güncellendi [skip ci]"
            git push
          else
            echo "Herhangi bir değişiklik yok."
          fi
